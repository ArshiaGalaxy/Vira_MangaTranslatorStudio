name: Bug report
description: Report something that isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please include enough detail to reproduce the problem.
  - type: dropdown
    id: install-path
    attributes:
      label: How are you running Vira?
      options:
        - Windows installer (desktop app)
        - From source (cloned repo)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11 23H2, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python / Node versions (source only)
      placeholder: e.g. Python 3.11, Node 20 — leave blank if using the installer
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error text
      description: Paste the error and, if relevant, the backend console output or app logs.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      placeholder: Screenshots, sample file details (no copyrighted pages), etc.
